<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./index.css" />
    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <div class="card">
      <div class="result">
        <h5>Your Result</h5>
        <div class="score">
          <h1>76</h1>
          <small>of 100</small>
        </div>
        <h3>Great</h3>
        <small
          >You scored higher than 65% of the people who have taken these
          tests.
          </small>
      </div>
      <div class="summary">
        <h4>Summary</h4>
        <div class="overview">
          <div class="reaction">
            <img src="./assets/images/icon-reaction.svg" alt="A Reaction" />
            <span class="reaction-name">Reaction</span>
            <div class="text-1">
              <span class="gotten-score">80</span>
              <span class="overall-score"> / 100</span>
            </div>
          </div>
          <div class="memory">
            <img src="./assets/images/icon-memory.svg" alt="A Brain" />
            <span class="memory-name">Memory</span>
            <div class="text">
              <span class="gotten-score">92</span>
              <span class="overall-score"> / 100</span>
            </div>
          </div>
          <div class="verbal">
            <img src="./assets/images/icon-verbal.svg" alt="A Message Bubble" />
            <span class="verbal-name">Verbal</span>
            <div class="texts">
              <span class="gotten-score">61</span>
              <span class="overall-score"> / 100</span>
            </div>
          </div>
          <div class="visual">
            <img src="./assets/images/icon-visual.svg" alt="An Eye" />
            <span class="visual-name">Visual</span>
            <div class="texts">
              <span class="gotten-score">72</span>
              <span class="overall-score"> / 100</span>
            </div>
          </div>
        </div>
        <button>Continue</button>
      </div>
    </div>

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  </body>
</html>
